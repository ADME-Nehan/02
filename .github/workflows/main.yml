name: CalmNest PICO D4 Compile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18

      - name: Show PlatformIO version
        run: pio --version

      - name: Test ESP32 A2DP v1.8.10
        run: |
          sed -i 's/v1\.8\.11/v1.8.10/g' platformio.ini
          cat platformio.ini

      - name: Clean project
        run: pio run -e pico32 -t clean

      - name: Compile ESP32 PICO D4
        run: pio run -e pico32
