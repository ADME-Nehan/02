name: CalmNest PICO D4 Compile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio==6.1.18

      - name: Compile ESP32 PICO D4
        working-directory: ESP32_PICO_D4_Audio
        run: pio run -e pico32
